name: Dev Container

on:
  push:
    branches:
      - master
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yaml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/build/devcontainer.json
          imageName: ${{ env.REGISTRY }}/nayetdet/orb_slam3
          imageTag: devcontainer
          cacheFrom: ${{ env.REGISTRY }}/nayetdet/orb_slam3:devcontainer
          push: always
