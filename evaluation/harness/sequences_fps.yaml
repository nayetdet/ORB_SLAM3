# Registry of the UNPACED FPS experiment (Zhang 2023, Table IV "Proposed FPS (Hz)", Table X, sec. 4.5).
# Use it with run_interleaved.py --registry evaluation/harness/sequences_fps.yaml, with ORB_NO_PACING=1 in the environment of
# the SLAM process (evaluation/run_extra.sh does): the example binaries then do not sleep to the dataset timestamps and print
# "Processed N frames in X.XX s = Y.YY fps" (frames / wall-clock time of the frame loop, Shutdown excluded; log_metrics.py
# reads it as log_metrics.fps and the cost form log_metrics.frame_time_ms).
#
# Arms, per dataset, identical to the confirmatory EuRoC arms (evaluation/PRE_REGISTRATION_confirmatory.md) so that they differ
# in exactly what they are named for; syncShutdown 1 everywhere:
#   base      stock ORB-SLAM3
#   c1        base + final global BA (GlobalBA.final)
#   faithful  the thesis' dense system (online, unbounded queue)
#   imp       faithful + queueLimit 3 + lowPriority + final BA + voxelSafe
# The settings files are generated by make_extra_settings.py (TUM, KITTI) or are the confirmatory ones (EuRoC T1000).
# nFeatures: TUM 1000, EuRoC 1000 (thesis sec. 4.2), KITTI 2000 (thesis Table X).
#
# Sequences: TUM fr1_desk (Table IV: 23.7 Hz), EuRoC MH01 (V2_02 of Table X is not installed), KITTI 07 (Table X).

roots:
  euroc: ~/Datasets/EuRoC
  kitti: ~/Datasets/KITTI/odometry/dataset
  tum: ~/Datasets/TUM

vocabulary: Vocabulary/ORBvoc.txt

x-tum: &tum
  dataset: tum
  sensor: rgbd
  align: se3
  binary: Examples/RGB-D/rgbd_tum
  associations_dir: Examples/RGB-D/associations
  est_format: orb_tum
  gt_format: gt_tum
  gt_from_sequence: "groundtruth.txt"
  max_diff: 0.02
x-euroc: &euroc
  dataset: euroc
  sensor: stereo
  align: se3
  binary: Examples/Stereo/stereo_euroc
  timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
  est_format: orb_euroc
  gt_format: gt_euroc
  gt_dir: evaluation/Ground_truth/EuRoC_left_cam
  gt_template: "{gt}"
  max_diff: 0.02
x-kitti: &kitti
  dataset: kitti
  sensor: stereo
  align: se3
  binary: Examples/Stereo/stereo_kitti
  est_format: orb_kitti
  gt_format: gt_kitti
  gt_template: "poses/{gt}"
  max_diff: 0.5
  kitti_relative: true

configs:
  tum_f_base:
    <<: *tum
    settings: Examples/RGB-D/TUM1_Sync.yaml
    preflight_expect: ['Features per image: 1000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
    run_forbid: ['Final global bundle adjustment']
  tum_f_c1:
    <<: *tum
    settings: Examples/RGB-D/TUM1_Sync_C1.yaml
    preflight_expect: ['Features per image: 1000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited', 'Final global bundle adjustment done', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
  tum_f_faithful:
    <<: *tum
    settings: Examples/RGB-D/TUM1_Dense_Sync.yaml
    preflight_expect: ['Features per image: 1000', '\[Dense\] reconstruction enabled']
    preflight_forbid: ['extensions\s*:']
    run_expect: ['Shutdown: waited', 'Dense Reconstruction timing', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
    run_forbid: ['Final global bundle adjustment']
  tum_f_imp:
    <<: *tum
    settings: Examples/RGB-D/TUM1_Dense_Imp_Sync.yaml
    preflight_expect: ['Features per image: 1000', '\[Dense\] reconstruction enabled', 'queueLimit=3 lowPriority=1', 'voxelSafe=1']
    run_expect: ['Shutdown: waited', 'Final global bundle adjustment done', 'Dense Reconstruction timing', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']

  euroc_f_base:
    <<: *euroc
    settings: Examples/Stereo/EuRoC_T1000.yaml
    preflight_expect: ['Features per image: 1000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
    run_forbid: ['Final global bundle adjustment']
  euroc_f_c1:
    <<: *euroc
    settings: Examples/Stereo/EuRoC_T1000_C1.yaml
    preflight_expect: ['Features per image: 1000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited', 'Final global bundle adjustment done', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
  euroc_f_faithful:
    <<: *euroc
    settings: Examples/Stereo/EuRoC_Dense_T1000.yaml
    preflight_expect: ['Features per image: 1000', '\[Dense\] reconstruction enabled']
    preflight_forbid: ['extensions\s*:']
    run_expect: ['Shutdown: waited', 'Dense Reconstruction timing', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
    run_forbid: ['Final global bundle adjustment']
  euroc_f_imp:
    <<: *euroc
    settings: Examples/Stereo/EuRoC_Dense_Imp_T1000.yaml
    preflight_expect: ['Features per image: 1000', '\[Dense\] reconstruction enabled', 'queueLimit=3 lowPriority=1', 'voxelSafe=1']
    run_expect: ['Shutdown: waited', 'Final global bundle adjustment done', 'Dense Reconstruction timing', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']

  kitti_f_base:
    <<: *kitti
    preflight_expect: ['Features per image: 2000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
    run_forbid: ['Final global bundle adjustment']
  kitti_f_c1:
    <<: *kitti
    preflight_expect: ['Features per image: 2000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited', 'Final global bundle adjustment done', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
  kitti_f_faithful:
    <<: *kitti
    preflight_expect: ['Features per image: 2000', '\[Dense\] reconstruction enabled']
    preflight_forbid: ['extensions\s*:']
    run_expect: ['Shutdown: waited', 'Dense Reconstruction timing', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']
    run_forbid: ['Final global bundle adjustment']
  kitti_f_imp:
    <<: *kitti
    preflight_expect: ['Features per image: 2000', '\[Dense\] reconstruction enabled', 'queueLimit=3 lowPriority=1', 'voxelSafe=1']
    run_expect: ['Shutdown: waited', 'Final global bundle adjustment done', 'Dense Reconstruction timing', 'Processed \d+ frames in [0-9.]+ s = [0-9.]+ fps', 'ORB_NO_PACING=1']

sequences:
  tum_f_base:     {fr1_desk: {folder: rgbd_dataset_freiburg1_desk, assoc: fr1_desk.txt}}
  tum_f_c1:       {fr1_desk: {folder: rgbd_dataset_freiburg1_desk, assoc: fr1_desk.txt}}
  tum_f_faithful: {fr1_desk: {folder: rgbd_dataset_freiburg1_desk, assoc: fr1_desk.txt}}
  tum_f_imp:      {fr1_desk: {folder: rgbd_dataset_freiburg1_desk, assoc: fr1_desk.txt}}
  euroc_f_base:     {MH01: {folder: MH_01_easy, times: MH01.txt, gt: MH01_GT.txt}}
  euroc_f_c1:       {MH01: {folder: MH_01_easy, times: MH01.txt, gt: MH01_GT.txt}}
  euroc_f_faithful: {MH01: {folder: MH_01_easy, times: MH01.txt, gt: MH01_GT.txt}}
  euroc_f_imp:      {MH01: {folder: MH_01_easy, times: MH01.txt, gt: MH01_GT.txt}}
  kitti_f_base:     {"07": {folder: sequences/07, gt: "07.txt", settings: Examples/Stereo/KITTI04-12_Sync.yaml}}
  kitti_f_c1:       {"07": {folder: sequences/07, gt: "07.txt", settings: Examples/Stereo/KITTI04-12_Sync_C1.yaml}}
  kitti_f_faithful: {"07": {folder: sequences/07, gt: "07.txt", settings: Examples/Stereo/KITTI04-12_Dense_Sync.yaml}}
  kitti_f_imp:      {"07": {folder: sequences/07, gt: "07.txt", settings: Examples/Stereo/KITTI04-12_Dense_Imp_Sync.yaml}}
