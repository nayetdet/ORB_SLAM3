# Benchmark registry for the Fase 0 evaluation harness.
#
# Fill in `roots` with your local dataset paths; everything else is already wired
# to the files that ship with this repo. Paths without a leading / are resolved
# against the repo root.

roots:
  # EuRoC: one folder per sequence, each containing mav0/
  euroc: ~/Datasets/EuRoC
  # KITTI odometry: expects sequences/ and poses/ underneath
  kitti: ~/Datasets/KITTI/odometry/dataset
  # TUM RGB-D: one rgbd_dataset_freiburgN_* folder per sequence
  tum: ~/Datasets/TUM

vocabulary: Vocabulary/ORBvoc.txt

# ---------------------------------------------------------------------------
# Configurations = one SLAM binary + settings + how to score its output.
#
# The `align` and `gt` fields are the point of this file. Getting them wrong is
# the single easiest way to produce numbers that look fine and mean nothing:
#   * align: sim3 only for monocular. Stereo and RGB-D observe scale, so scoring
#     them with a solved-for scale hides scale drift and breaks comparability
#     with the published ORB-SLAM2/3 tables.
#   * gt frame: System::SaveTrajectoryEuRoC writes the IMU/body pose for inertial
#     sensors (GetImuPose, mTbc) and the cam0 pose otherwise. So pure stereo is
#     scored against Ground_truth/EuRoC_left_cam (cam0 frame) while inertial is
#     scored against the dataset's own state_groundtruth_estimate0 (body frame).
#     Crossing the two adds a fixed ~7 cm extrinsic offset to every pose.
# ---------------------------------------------------------------------------
configs:

  euroc_stereo:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam   # cam0 frame
    gt_template: "{gt}"
    max_diff: 0.02

  euroc_stereo_inertial:
    dataset: euroc
    sensor: imu_stereo
    align: se3
    binary: Examples/Stereo-Inertial/stereo_inertial_euroc
    settings: Examples/Stereo-Inertial/EuRoC.yaml
    timestamps_dir: Examples/Stereo-Inertial/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    # body/IMU frame -- comes from the sequence folder, not from Ground_truth/
    gt_from_sequence: "mav0/state_groundtruth_estimate0/data.csv"
    max_diff: 0.02

  kitti_stereo:
    dataset: kitti
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_kitti
    est_format: orb_kitti
    gt_format: gt_kitti
    gt_template: "poses/{gt}"
    # KITTI trajectories are frame-indexed, not timestamped: match frame i to i.
    max_diff: 0.5
    kitti_relative: true

  tum_rgbd:
    dataset: tum
    sensor: rgbd
    align: se3
    binary: Examples/RGB-D/rgbd_tum
    associations_dir: Examples/RGB-D/associations
    est_format: orb_tum
    gt_format: gt_tum
    gt_from_sequence: "groundtruth.txt"
    max_diff: 0.02

  # --- Zhang 2023 reproduction: same binaries, dense reconstruction switched on.
  # The *_Dense.yaml settings differ from their baseline twin only in
  # Dense.enabled, so a baseline/dense pair isolates the cost of the dense thread.

  euroc_stereo_dense:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC_Dense.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam
    gt_template: "{gt}"
    max_diff: 0.02

  kitti_stereo_dense:
    dataset: kitti
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_kitti
    est_format: orb_kitti
    gt_format: gt_kitti
    gt_template: "poses/{gt}"
    max_diff: 0.5
    kitti_relative: true

  tum_rgbd_dense:
    dataset: tum
    sensor: rgbd
    align: se3
    binary: Examples/RGB-D/rgbd_tum
    associations_dir: Examples/RGB-D/associations
    est_format: orb_tum
    gt_format: gt_tum
    gt_from_sequence: "groundtruth.txt"
    max_diff: 0.02

  # ---------------------------------------------------------------------------
  # melhorias.md variants. Settings are *_Dense_Imp.yaml / *_Dense_Offline.yaml.
  # ---------------------------------------------------------------------------
  # --- improved variants: A1 queueLimit=3 + A2 lowPriority + A4 + C1 (GlobalBA.final)

  euroc_stereo_dense_imp:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC_Dense_Imp.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam
    gt_template: "{gt}"
    max_diff: 0.02

  kitti_stereo_dense_imp:
    dataset: kitti
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_kitti
    est_format: orb_kitti
    gt_format: gt_kitti
    gt_template: "poses/{gt}"
    max_diff: 0.5
    kitti_relative: true

  tum_rgbd_dense_imp:
    dataset: tum
    sensor: rgbd
    align: se3
    binary: Examples/RGB-D/rgbd_tum
    associations_dir: Examples/RGB-D/associations
    est_format: orb_tum
    gt_format: gt_tum
    gt_from_sequence: "groundtruth.txt"
    max_diff: 0.02

  # --- improved variants: A3 offline + B1 + A5, no C1 (trajectory == baseline by construction)

  euroc_stereo_dense_offline:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC_Dense_Offline.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam
    gt_template: "{gt}"
    max_diff: 0.02

  kitti_stereo_dense_offline:
    dataset: kitti
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_kitti
    est_format: orb_kitti
    gt_format: gt_kitti
    gt_template: "poses/{gt}"
    max_diff: 0.5
    kitti_relative: true

  tum_rgbd_dense_offline:
    dataset: tum
    sensor: rgbd
    align: se3
    binary: Examples/RGB-D/rgbd_tum
    associations_dir: Examples/RGB-D/associations
    est_format: orb_tum
    gt_format: gt_tum
    gt_from_sequence: "groundtruth.txt"
    max_diff: 0.02

  # ---------------------------------------------------------------------------
  # Interleaved, CPU-limited pilot (run_interleaved.py, evaluation/run_pilot.sh).
  # ORBextractor.nFeatures is 1000 like the thesis (the EuRoC.yaml of this repo has 1200) and
  # System.syncShutdown is 1 in every arm, so the arms differ only in what the pilot varies:
  #   euroc_p_base      plain ORB-SLAM3 stereo
  #   euroc_p_base_b    A/A replicate: the same settings file under another name; its comparison
  #                     with euroc_p_base is the empirical false-positive rate of the analysis
  #   euroc_p_c1        baseline + GlobalBA.final (C1 alone: splits C1 from A1/A2 in euroc_p_imp)
  #   euroc_p_faithful  thesis-faithful dense (unbounded queue, normal priority, pcl voxel filter)
  #   euroc_p_imp       dense_imp: queueLimit 3, lowPriority, GlobalBA.final, overflow-safe voxel filter
  # check_yaml_pairs.py proves from the settings files that they differ only there.
  # preflight_expect / preflight_forbid: regexes the 25 s preflight requires in / forbids from
  # the log (settings that did not take effect show up here, not after hours of runs).
  # run_expect / run_forbid: the same for the log of a FINISHED run (run_interleaved.py records the
  # result as log_check in results.json and flags a run that fails it): what only shows at shutdown,
  # i.e. that System.syncShutdown ('Shutdown: waited') and GlobalBA.final ('Final global bundle
  # adjustment done') took effect in the arms that set them and in no other arm. An old binary
  # ignores both keys silently; these lines are the proof that the binary was the right one.
  # kitti_s_nosync / kitti_s_sync: the shutdown-synchronisation check on KITTI 04-10 (the
  # existing KITTI04-12.yaml is the no-sync arm).
  # ---------------------------------------------------------------------------
  euroc_p_base:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC_T1000.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam
    gt_template: "{gt}"
    max_diff: 0.02
    preflight_expect: ['Features per image: 1000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited']
    run_forbid: ['Final global bundle adjustment']

  euroc_p_base_b:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC_T1000.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam
    gt_template: "{gt}"
    max_diff: 0.02
    preflight_expect: ['Features per image: 1000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited']
    run_forbid: ['Final global bundle adjustment']

  euroc_p_c1:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC_T1000_C1.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam
    gt_template: "{gt}"
    max_diff: 0.02
    preflight_expect: ['Features per image: 1000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited', 'Final global bundle adjustment done']

  euroc_p_faithful:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC_Dense_T1000.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam
    gt_template: "{gt}"
    max_diff: 0.02
    preflight_expect: ['Features per image: 1000', '\[Dense\] reconstruction enabled']
    # the 'extensions' line is printed only when some opt-in switch is on: the thesis-faithful arm must have none
    preflight_forbid: ['extensions\s*:']
    run_expect: ['Shutdown: waited', 'Dense Reconstruction timing']
    run_forbid: ['Final global bundle adjustment']

  euroc_p_imp:
    dataset: euroc
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_euroc
    settings: Examples/Stereo/EuRoC_Dense_Imp_T1000.yaml
    timestamps_dir: Examples/Stereo/EuRoC_TimeStamps
    est_format: orb_euroc
    gt_format: gt_euroc
    gt_dir: evaluation/Ground_truth/EuRoC_left_cam
    gt_template: "{gt}"
    max_diff: 0.02
    preflight_expect: ['Features per image: 1000', '\[Dense\] reconstruction enabled', 'queueLimit=3 lowPriority=1', 'voxelSafe=1']
    run_expect: ['Shutdown: waited', 'Final global bundle adjustment done', 'Dense Reconstruction timing']

  kitti_s_nosync:
    dataset: kitti
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_kitti
    est_format: orb_kitti
    gt_format: gt_kitti
    gt_template: "poses/{gt}"
    max_diff: 0.5
    kitti_relative: true
    preflight_expect: ['Features per image: 2000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_forbid: ['Shutdown: waited']

  kitti_s_sync:
    dataset: kitti
    sensor: stereo
    align: se3
    binary: Examples/Stereo/stereo_kitti
    est_format: orb_kitti
    gt_format: gt_kitti
    gt_template: "poses/{gt}"
    max_diff: 0.5
    kitti_relative: true
    preflight_expect: ['Features per image: 2000']
    preflight_forbid: ['\[Dense\] reconstruction enabled']
    run_expect: ['Shutdown: waited']


# ---------------------------------------------------------------------------
# Sequences. `folder` is relative to the dataset root.
# ---------------------------------------------------------------------------
sequences:

  euroc_stereo: &euroc_seqs
    MH01: {folder: MH_01_easy,      times: MH01.txt, gt: MH01_GT.txt}
    MH02: {folder: MH_02_easy,      times: MH02.txt, gt: MH02_GT.txt}
    MH03: {folder: MH_03_medium,    times: MH03.txt, gt: MH03_GT.txt}
    MH04: {folder: MH_04_difficult, times: MH04.txt, gt: MH04_GT.txt}
    MH05: {folder: MH_05_difficult, times: MH05.txt, gt: MH05_GT.txt}
    V101: {folder: V1_01_easy,      times: V101.txt, gt: V101_GT.txt}
    V102: {folder: V1_02_medium,    times: V102.txt, gt: V102_GT.txt}
    V103: {folder: V1_03_difficult, times: V103.txt, gt: V103_GT.txt}
    V201: {folder: V2_01_easy,      times: V201.txt, gt: V201_GT.txt}
    V202: {folder: V2_02_medium,    times: V202.txt, gt: V202_GT.txt}
    V203: {folder: V2_03_difficult, times: V203.txt, gt: V203_GT.txt}

  euroc_stereo_inertial: *euroc_seqs
  euroc_stereo_dense: *euroc_seqs

  kitti_stereo:
    "00": {folder: sequences/00, gt: "00.txt", settings: Examples/Stereo/KITTI00-02.yaml}
    "01": {folder: sequences/01, gt: "01.txt", settings: Examples/Stereo/KITTI00-02.yaml}
    "02": {folder: sequences/02, gt: "02.txt", settings: Examples/Stereo/KITTI00-02.yaml}
