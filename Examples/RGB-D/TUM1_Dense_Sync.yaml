%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
Camera1.fx: 517.306408
Camera1.fy: 516.469215
Camera1.cx: 318.643040
Camera1.cy: 255.313989

Camera1.k1: 0.262383
Camera1.k2: -0.953104
Camera1.p1: -0.005358
Camera1.p2: 0.002628
Camera1.k3: 1.163314

Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.07732

# Depth map values factor
RGBD.DepthMapFactor: 5000.0 # 1.0 for ROS_bag

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
# A4: ORBextractor.nFeatures is kept IDENTICAL to the baseline TUM1.yaml so a baseline-vs-dense
# comparison isolates the dense thread. The thesis (sec. 4.2) halves it to buy speed;
# do not reduce it here unless that is exactly what is being measured.
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0


#--------------------------------------------------------------------------------------------
# Dense Reconstruction (Zhang 2023, ch. 3) -- ENABLED.
# Generated from TUM1.yaml; identical except Dense.enabled. Keeping the two as
# separate files lets a benchmark run baseline and dense back to back
# without editing anything between runs.
# Set Dense.enabled to 1 to reproduce the thesis pipeline. With 0 the system is
# bit-for-bit stock ORB-SLAM3 and the dense thread is never created.
#--------------------------------------------------------------------------------------------
Dense.enabled: 1

# Voxel grid leaf size [m]. Sec. 3.2 removes "more than 90% of the voxels" here.
Dense.resolution: 0.01

# d_min / d_max of eq. (34): the depth range a point must fall in to be used,
# and the range over which its confidence is interpolated.
Dense.depthMin: 0.5
Dense.depthMax: 4.0

# Sec. 3.5: probabilistic merge. Turn on for multi-sequence runs; P_max is the
# confidence at d_min (P_min = 1 - P_max). mergeDistance 0 means "use resolution".
Dense.probabilisticMerge: 0
Dense.probMax: 0.9
Dense.mergeDistance: 0.0

# Prior cloud to merge into, for the second and later sequences of a
# multi-sequence run (sec. 3.5). Empty means start from scratch.
Dense.loadCloud: ""

# Octomap, sec. 3.4. Thesis 4.4: ~0.01 m indoors, >=0.05 m outdoors (0.2 typical).
# Ray casting carves free space (eq. 31-33) but makes the .ot bigger than
# the .pcd. Table IX reports the octomap 4.8-6.5x smaller, so it is off by
# default to match. Turn on for a navigable occupancy map.
Dense.octomapRayCast: 0
Dense.octomapEnabled: 1
Dense.octomapResolution: 0.01

# Output: <saveDirectory>/<savePrefix>_cloud.pcd and _octomap.ot
Dense.saveDirectory: "."
Dense.savePrefix: "tum_fr1"

# --- Opt-in extensions (defaults below = thesis-faithful behaviour) -----------------------
# A1: max keyframes queued for the dense thread; 0 = unlimited, else drop the oldest.
Dense.queueLimit: 0
# A2: 1 = run the dense thread at SCHED_IDLE (fallback nice +10).
Dense.lowPriority: 0
# A3: "online" (thesis) or "offline" (store keyframes+images, build everything at
# Save() with final poses; implies reprojectOptimized and octomapAtEnd).
Dense.mode: "online"
# Offline only: directory to spill stored images to disk instead of RAM ("" = RAM).
Dense.offlineSpillDir: ""
# B1: keep clouds in the camera frame and transform with final keyframe poses at Save().
Dense.reprojectOptimized: 0
# A5: build the octomap once at Save() (final poses) instead of per keyframe.
Dense.octomapAtEnd: 0
# D1 (only with octomapRayCast: 1): max ray length in metres (<=0 = unlimited) and
# octomap "discretize" (group rays per voxel).
Dense.octomapMaxRange: -1.0
Dense.octomapDiscretize: 0
# B3: statistical outlier removal per keyframe cloud.
Dense.outlierRemoval: 0
Dense.outlierMeanK: 20
Dense.outlierStddev: 1.0
# B4 (stereo only, needs opencv_ximgproc): WLS disparity filter.
Dense.wlsFilter: 0
Dense.wlsLambda: 8000.0
Dense.wlsSigmaColor: 1.5
# D2: also write <prefix>_octomap.bt and print same-format compression ratios.
Dense.octomapWriteBt: 0
Dense.compressionReport: 0
# Global voxel filter (the periodic one over the whole world cloud): 1 = overflow-safe, 0 = pcl::VoxelGrid as in
# the thesis pipeline, which returns the cloud UNFILTERED when its bounding box needs more than INT32_MAX voxels
# of this leaf size (log: "Leaf size is too small for the input dataset").
Dense.voxelSafe: 0

#--------------------------------------------------------------------------------------------
# System.UseViewer: 0 disables the Pangolin window. Required on a headless machine,
# and it should be 0 for accuracy benchmarks anyway -- the viewer competes for CPU
# with Local BA, which changes the ATE.
#--------------------------------------------------------------------------------------------
System.UseViewer: 0

#--------------------------------------------------------------------------------------------
# System.syncShutdown: 1 makes System::Shutdown() wait for LocalMapping, LoopClosing and any
# running global BA to finish before it returns, in every arm of the pilot, so that the
# trajectory is saved from the same settled map whether or not an arm has dense or final-BA
# work at shutdown. 0 (the default) keeps the original behaviour, in which a plain baseline
# returns at once. The wait is logged as "Shutdown: waited X s".
#--------------------------------------------------------------------------------------------
System.syncShutdown: 1
